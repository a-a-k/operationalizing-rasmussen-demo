name: allocation-threshold-scenarios

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit containing threshold-scenarios-0.1.1
        required: true
        type: string
      execute:
        description: Execute the fixed 120 points after the maximum-load baseline gate
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: allocation-threshold-scenarios
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout experiment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout pinned runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: 1755859a9de82c2e5e225be68abc401a5ebf2b4f
          path: upstream/otel-demo
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Static verification and unit tests
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          sha256sum --check SHA256SUMS
          python -m unittest discover -s probe1/tests -v
          python -m unittest discover -s probe2/tests -v
          python -m unittest discover -s probe3/tests -v
          python -m unittest discover -s probe4/tests -v
          python probe4/scripts/scenarios.py verify \
            --upstream-dir upstream/otel-demo --check-runner \
            --report artifacts/preflight/verification.json
      - name: Full-duration maximum-load reference gate outside the scientific sample
        run: |
          python probe4/scripts/scenarios.py run \
            --upstream-dir upstream/otel-demo --block-id smoke --smoke \
            --artifact-dir artifacts/preflight/smoke
      - name: Fixed 20-job matrix
        id: matrix
        run: |
          matrix="$(python probe4/scripts/scenarios.py matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Save preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scenarios-preflight
          path: artifacts/preflight/
          if-no-files-found: warn
          retention-days: 14

  execute:
    if: inputs.execute
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    name: ${{ matrix.block_id }}
    env:
      BLOCK_ID: ${{ matrix.block_id }}
    steps:
      - name: Checkout experiment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout pinned runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: 1755859a9de82c2e5e225be68abc401a5ebf2b4f
          path: upstream/otel-demo
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Execute fixed allocations with fresh-stack baselines
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python probe4/scripts/scenarios.py run \
            --upstream-dir upstream/otel-demo --block-id "$BLOCK_ID" \
            --artifact-dir "artifacts/$BLOCK_ID"
      - name: Save every primary stream and diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scenarios-block-${{ matrix.block_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1

  aggregate:
    if: always() && inputs.execute && needs.preflight.result == 'success'
    needs: [preflight, execute]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout experiment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Download all available observations
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: scenarios-block-*
          path: scenarios-artifacts
      - name: Compare all thresholds without calibration or a pass criterion
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python probe4/scripts/compare.py \
            --results-root scenarios-artifacts --output-dir scenarios-results \
            --repository-commit "$GITHUB_SHA"
          cat scenarios-results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          python -c 'import json; from pathlib import Path; s=json.loads(Path("scenarios-results/comparison.json").read_text()); assert s["status"] == "complete", "Missing blocks: see retained report"'
      - name: Save comparison and complete point tables
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scenarios-result
          path: scenarios-results/
          if-no-files-found: warn
          retention-days: 90
