name: accumulated-guarded-history-analysis

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact saved-data analysis and archive commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: accumulated-guarded-history-analysis
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify frozen observations and lightweight checks
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          sha256sum --check SHA256SUMS
          python -B -m unittest discover -s probe7/tests -v
      - name: Analyze saved allocation histories without starting services
        run: |
          set -euo pipefail
          python -B probe7/scripts/analyze_accumulated.py --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --output-dir artifacts/accumulated-history-v0.1.0
          cat artifacts/accumulated-history-v0.1.0/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: accumulated-history-v0.1.0
          path: artifacts/accumulated-history-v0.1.0/
          if-no-files-found: error
          retention-days: 90
