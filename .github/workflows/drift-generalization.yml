name: drift-generalization-250

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact fixed 250-job campaign commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: drift-generalization-250
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the fixed comparison
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          sha256sum --check SHA256SUMS
          python -B -m unittest discover -s probe9/tests -v
          python -B -c 'import sys; sys.path.insert(0,"probe8/scripts"); from warning_model import WarningModel; WarningModel()'
      - name: Emit exactly 250 matrix jobs
        id: matrix
        run: |
          echo "matrix=$(python -B probe9/scripts/live_runner.py matrix)" >> "$GITHUB_OUTPUT"
      - name: Preflight the native engine on the archived reference set
        run: |
          set -euo pipefail
          mkdir -p prometheus-preflight
          python -B - <<'PY'
          import hashlib, json, pathlib, tarfile, urllib.request
          spec = json.loads(pathlib.Path('probe9/analysis-v0.1.0.json').read_text())['prometheus']
          target = pathlib.Path('prometheus-preflight/prometheus.tar.gz')
          urllib.request.urlretrieve(spec['linux_amd64_url'], target)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == spec['tar_sha256']
          with tarfile.open(target) as archive:
              archive.extractall(target.parent, filter='data')
          PY
          python -B probe9/scripts/native_preflight.py --binary-dir prometheus-preflight/prometheus-3.15.0.linux-amd64

  execute:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 250
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    name: ${{ matrix.block_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: 1755859a9de82c2e5e225be68abc401a5ebf2b4f
          path: upstream/otel-demo
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Run paired adaptive and control histories with both frozen observers
        env:
          BLOCK_ID: ${{ matrix.block_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python -B probe9/scripts/live_runner.py run --upstream-dir upstream/otel-demo --block-id "$BLOCK_ID" --output-dir "artifacts/$BLOCK_ID"
      - name: Independently rescore and compact primary evidence
        if: always()
        env:
          BLOCK_ID: ${{ matrix.block_id }}
        run: |
          set -euo pipefail
          if test -f "artifacts/$BLOCK_ID/block.json"; then
            python -B probe7/scripts/audit_primary.py --results-root "artifacts/$BLOCK_ID" --output-dir "artifacts/$BLOCK_ID-primary"
          fi
      - name: Preserve compact observations and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: drift-generalization-${{ matrix.block_id }}
          path: |
            artifacts/${{ matrix.block_id }}/block.json
            artifacts/${{ matrix.block_id }}/host-context.json
            artifacts/${{ matrix.block_id }}/rendered-compose.json
            artifacts/${{ matrix.block_id }}/image-inspect.json
            artifacts/${{ matrix.block_id }}/*/history.json
            artifacts/${{ matrix.block_id }}/*/container-events.jsonl.gz
            artifacts/${{ matrix.block_id }}/*/final-container-inspect.json
            artifacts/${{ matrix.block_id }}-primary/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  aggregate:
    if: always() && needs.verify.result == 'success'
    needs: [verify, execute]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: drift-generalization-*
          path: drift-inputs
      - name: Download checksum-pinned native Prometheus
        run: |
          set -euo pipefail
          mkdir -p prometheus-bin
          python -B - <<'PY'
          import hashlib, json, pathlib, tarfile, urllib.request
          spec = json.loads(pathlib.Path('probe9/analysis-v0.1.0.json').read_text())['prometheus']
          target = pathlib.Path('prometheus-bin/prometheus.tar.gz')
          urllib.request.urlretrieve(spec['linux_amd64_url'], target)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == spec['tar_sha256']
          with tarfile.open(target) as archive:
              archive.extractall(target.parent, filter='data')
          PY
      - name: Compare ILR and shares separately against native Prometheus
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python -B probe9/scripts/analyze.py --inputs drift-inputs --binary-dir prometheus-bin/prometheus-3.15.0.linux-amd64 --output-dir drift-results --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          cat drift-results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: drift-generalization-results
          path: |
            drift-results/*.json
            drift-results/*.csv
            drift-results/*.md
            drift-results/*.jsonl.gz
            drift-results/blocks/
            drift-results/native-engine/*.log
            drift-results/native-engine/*.yml
            drift-results/native-engine/*.openmetrics
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1
