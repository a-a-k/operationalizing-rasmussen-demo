name: continuous-mewma-250

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact replication implementation commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: continuous-mewma-250
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      test_matrix: ${{ steps.matrix.outputs.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify implementation and replication invariants
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          sha256sum --quiet --check SHA256SUMS
          pip install -r drift-monitor/requirements.txt
          python -B -m unittest discover -s drift-monitor/tests -v
      - id: matrix
        env:
          MONITOR_DESIGN: drift-monitor/design-v0.1.1.json
        run: |
          echo "test=$(python -B drift-monitor/scripts/monitor_run.py matrix --phase test)" >> "$GITHUB_OUTPUT"
          python -B -c 'import sys; sys.path.insert(0,"drift-monitor/scripts"); from monitor_core import load,DESIGN; c=load(DESIGN)["source_frozen_model"]; print("source_run="+c["run_id"]); print("source_artifact="+c["artifact_name"])' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.matrix.outputs.source_run }}
          name: ${{ steps.matrix.outputs.source_artifact }}
          path: frozen-inputs
      - name: Verify exact source model without refitting
        env:
          MONITOR_DESIGN: drift-monitor/design-v0.1.1.json
        run: |
          python -B -c 'import sys; from pathlib import Path; sys.path.insert(0,"drift-monitor/scripts"); from monitor_core import load_frozen; m=load_frozen(Path("frozen-inputs")); print("Verified immutable source model:", m["run_id"], m["execution_commit"])'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: monitor-frozen-model-attempt-${{ github.run_attempt }}
          path: frozen-inputs/
          if-no-files-found: error
          retention-days: 90

  test:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 250
      matrix: ${{ fromJSON(needs.prepare.outputs.test_matrix) }}
    name: test-${{ matrix.block_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      MONITOR_DESIGN: drift-monitor/design-v0.1.1.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: 1755859a9de82c2e5e225be68abc401a5ebf2b4f
          path: upstream/otel-demo
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: pip install -r drift-monitor/requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: monitor-frozen-model-attempt-*
          path: frozen-inputs
      - name: Select exact-quota driver on the disposable runner
        run: |
          mkdir -p artifacts/driver
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3 boundary/prediction/scripts/quota_precision.py configure --output artifacts/driver
      - name: Fresh pair under unchanged measurement and detector settings
        env:
          BLOCK_ID: ${{ matrix.block_id }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python -B drift-monitor/scripts/monitor_run.py run --phase test --block-id "$BLOCK_ID" --upstream-dir upstream/otel-demo --output-dir "artifacts/$BLOCK_ID" --model-folder frozen-inputs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: monitor-test-${{ matrix.block_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  compare:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MONITOR_DESIGN: drift-monitor/design-v0.1.1.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: pip install -r drift-monitor/requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: monitor-frozen-model-attempt-*
          path: frozen-inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: monitor-test-*
          path: test-inputs
      - name: Replay all online prefixes and summarize the new batch separately
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python -B drift-monitor/scripts/monitor_analyze.py compare --inputs test-inputs --model-folder frozen-inputs --output-dir monitor-results
          python -c 'import json; print(json.dumps(json.load(open("monitor-results/summary.json")),indent=2))' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: monitor-results-attempt-${{ github.run_attempt }}
          path: monitor-results/
          if-no-files-found: warn
          retention-days: 90
