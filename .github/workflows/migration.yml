name: adaptive-boundary-migration

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit containing adaptive-migration-0.1.0
        required: true
        type: string
      execute:
        description: Execute 20 paired sequential adaptation/control histories after the engineering gate
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: adaptive-boundary-migration
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout experiment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout pinned runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: 1755859a9de82c2e5e225be68abc401a5ebf2b4f
          path: upstream/otel-demo
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify immutable inputs and unit tests
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          sha256sum --check SHA256SUMS
          python -m unittest discover -s probe1/tests -v
          python -m unittest discover -s probe2/tests -v
          python -m unittest discover -s probe3/tests -v
          python -m unittest discover -s probe4/tests -v
          python -m unittest discover -s probe5/tests -v
          python probe5/scripts/drift.py verify --upstream-dir upstream/otel-demo
      - name: Concurrent workload and initially safe reference gate
        run: |
          python probe5/scripts/drift.py run --upstream-dir upstream/otel-demo \
            --block-id smoke --smoke --artifact-dir artifacts/preflight
      - name: Fixed 20-runner matrix
        id: matrix
        run: |
          matrix="$(python probe5/scripts/drift.py matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Save all engineering gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: migration-preflight
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  execute:
    if: inputs.execute
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    name: ${{ matrix.block_id }}
    env:
      BLOCK_ID: ${{ matrix.block_id }}
    steps:
      - name: Checkout experiment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout pinned runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: 1755859a9de82c2e5e225be68abc401a5ebf2b4f
          path: upstream/otel-demo
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Execute fresh-stack sequential histories
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python probe5/scripts/drift.py run --upstream-dir upstream/otel-demo \
            --block-id "$BLOCK_ID" --artifact-dir "artifacts/$BLOCK_ID"
      - name: Save all histories including short and failed histories
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: migration-block-${{ matrix.block_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1

  aggregate:
    if: always() && inputs.execute && needs.preflight.result == 'success'
    needs: [preflight, execute]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout experiment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Download every available block
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: migration-block-*
          path: migration-artifacts
      - name: Analyze measured migration and unchanged controls
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python probe5/scripts/analyze_migration.py --results-root migration-artifacts \
            --output-dir migration-results --repository-commit "$GITHUB_SHA"
          cat migration-results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          python -c 'import json; from pathlib import Path; s=json.loads(Path("migration-results/summary.json").read_text()); assert s["status"] == "complete", "Missing blocks are recorded"'
      - name: Save complete trajectories and paired contrasts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: migration-result
          path: migration-results/
          if-no-files-found: warn
          retention-days: 90
