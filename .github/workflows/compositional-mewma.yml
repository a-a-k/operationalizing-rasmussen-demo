name: continuous-mewma-background

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact continuous-monitor implementation commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: continuous-mewma
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      background_matrix: ${{ steps.matrix.outputs.background }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: 1755859a9de82c2e5e225be68abc401a5ebf2b4f
          path: upstream/otel-demo
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify the complete-state observer and counter integration
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          sha256sum --quiet --check SHA256SUMS
          pip install -r drift-monitor/requirements.txt
          python -B -m unittest discover -s drift-monitor/tests -v
      - id: matrix
        run: |
          echo "background=$(python -B drift-monitor/scripts/monitor_run.py matrix --phase background)" >> "$GITHUB_OUTPUT"
      - name: Select exact-quota driver on the disposable runner
        run: |
          mkdir -p artifacts/driver
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3 runtime/quota_driver.py --output artifacts/driver
      - name: Short engineering smoke of continuous load and native measurements
        run: |
          python -B drift-monitor/scripts/monitor_run.py run --phase smoke --upstream-dir upstream/otel-demo --output-dir artifacts/smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: monitor-engineering-attempt-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  background:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.verify.outputs.background_matrix) }}
    name: background-${{ matrix.block_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: 1755859a9de82c2e5e225be68abc401a5ebf2b4f
          path: upstream/otel-demo
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: pip install -r drift-monitor/requirements.txt
      - name: Select exact-quota driver
        run: |
          mkdir -p artifacts/driver
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3 runtime/quota_driver.py --output artifacts/driver
      - name: Record continuous background without interventions
        env:
          BLOCK_ID: ${{ matrix.block_id }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python -B drift-monitor/scripts/monitor_run.py run --phase background --block-id "$BLOCK_ID" --upstream-dir upstream/otel-demo --output-dir "artifacts/$BLOCK_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: monitor-background-${{ matrix.block_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  freeze:
    if: always() && needs.verify.result == 'success'
    needs: [verify, background]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: pip install -r drift-monitor/requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: monitor-background-*
          path: background-inputs
      - name: Freeze means, full covariances and thresholds before test execution
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python -B drift-monitor/scripts/monitor_analyze.py freeze --inputs background-inputs --output-dir frozen
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: monitor-frozen-model-attempt-${{ github.run_attempt }}
          path: frozen/
          if-no-files-found: warn
          retention-days: 90
