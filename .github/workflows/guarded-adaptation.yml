name: guarded-multi-resource-adaptation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact implementation and input commit
        required: true
        type: string
      mode:
        description: Separate technical pilot or finalized main series
        required: true
        type: choice
        options: [pilot, campaign]
        default: pilot

permissions:
  contents: read

concurrency:
  group: guarded-multi-resource-adaptation
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify saved inputs and small tests
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          sha256sum --check SHA256SUMS
          python -B -m unittest discover -s probe7/tests -v
      - name: Select the explicit fixed matrix
        id: matrix
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = pilot ]; then
            echo 'matrix={"include":[{"pilot_id":1,"block_id":"pilot-01"},{"pilot_id":2,"block_id":"pilot-02"}]}' >> "$GITHUB_OUTPUT"
          else
            python -c 'import json; from pathlib import Path; assert json.loads(Path("probe7/design-v0.1.0.json").read_text())["ready"], "Finish technical feasibility before main execution"'
            echo "matrix=$(python -B probe7/scripts/runtime.py matrix)" >> "$GITHUB_OUTPUT"
          fi

  execute:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    name: ${{ matrix.block_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: 1755859a9de82c2e5e225be68abc401a5ebf2b4f
          path: upstream/otel-demo
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Run only the explicitly selected execution
        env:
          MODE: ${{ inputs.mode }}
          BLOCK_ID: ${{ matrix.block_id }}
          PILOT_ID: ${{ matrix.pilot_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          if [ "$MODE" = pilot ]; then
            python -B probe7/scripts/runtime.py run --upstream-dir upstream/otel-demo --pilot-id "$PILOT_ID" --output-dir "artifacts/$BLOCK_ID"
          else
            python -B probe7/scripts/runtime.py run --upstream-dir upstream/otel-demo --block-id "$BLOCK_ID" --output-dir "artifacts/$BLOCK_ID"
          fi
      - name: Preserve all readable observations and setup failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guarded-${{ inputs.mode }}-${{ matrix.block_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
