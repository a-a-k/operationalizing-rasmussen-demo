name: prospective-warning-confirmation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen-rule and independent confirmation commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prospective-warning-confirmation
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify frozen rule and small checks
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          sha256sum --check SHA256SUMS
          python -B -m unittest discover -s probe8/tests -v
          python -B -c 'import sys; sys.path.insert(0,"probe8/scripts"); from warning_model import WarningModel; WarningModel()'
      - name: Select exactly twenty new runner pairs
        id: matrix
        run: |
          echo "matrix=$(python -B probe8/scripts/live_runner.py matrix)" >> "$GITHUB_OUTPUT"

  execute:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    name: ${{ matrix.block_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: 1755859a9de82c2e5e225be68abc401a5ebf2b4f
          path: upstream/otel-demo
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Execute unchanged guarded policy with passive warnings
        env:
          BLOCK_ID: ${{ matrix.block_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python -B probe8/scripts/live_runner.py run --upstream-dir upstream/otel-demo --block-id "$BLOCK_ID" --output-dir "artifacts/$BLOCK_ID"
      - name: Preserve readable observations and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: warning-confirmation-${{ matrix.block_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1

  aggregate:
    if: always() && needs.verify.result == 'success'
    needs: [verify, execute]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: warning-confirmation-*
          path: warning-inputs
      - name: Audit primary outcomes and evaluate frozen live decisions
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python -B probe7/scripts/audit_primary.py --results-root warning-inputs --output-dir warning-results/primary
          python -B probe8/scripts/analyze_confirmation.py --inputs warning-inputs --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --output-dir warning-results/evaluation
          cat warning-results/evaluation/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: warning-confirmation-results
          path: warning-results/
          if-no-files-found: warn
          retention-days: 90
