name: native-practical-forecast-replay

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact saved-data replay commit
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Check archive and lightweight tests
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          sha256sum --check SHA256SUMS
          python -B -m unittest discover -s probe8/tests -v
      - name: Download pinned native Prometheus
        run: |
          set -euo pipefail
          mkdir -p artifacts/prometheus-bin
          python -B - <<'PY'
          import hashlib, json, pathlib, tarfile, urllib.request
          spec = json.loads(pathlib.Path('probe8/practical-baseline-v0.1.0.json').read_text())['prometheus']
          target = pathlib.Path('artifacts/prometheus-bin/prometheus.tar.gz')
          urllib.request.urlretrieve(spec['linux_amd64_url'], target)
          assert hashlib.sha256(target.read_bytes()).hexdigest() == spec['tar_sha256']
          with tarfile.open(target) as archive:
              archive.extractall(target.parent, filter='data')
          PY
      - name: Native query replay; no services or new observations
        run: |
          set -euo pipefail
          python -B probe8/scripts/prometheus_replay.py --binary-dir artifacts/prometheus-bin/prometheus-3.15.0.linux-amd64 --output-dir artifacts/practical-forecast-replay-v0.1.0 --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          cat artifacts/practical-forecast-replay-v0.1.0/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: practical-forecast-replay-v0.1.0
          path: |
            artifacts/practical-forecast-replay-v0.1.0/*.json
            artifacts/practical-forecast-replay-v0.1.0/*.jsonl.gz
            artifacts/practical-forecast-replay-v0.1.0/*.csv
            artifacts/practical-forecast-replay-v0.1.0/*.md
            artifacts/practical-forecast-replay-v0.1.0/*.log
            artifacts/practical-forecast-replay-v0.1.0/*.yml
            artifacts/practical-forecast-replay-v0.1.0/*.openmetrics
          if-no-files-found: error
          retention-days: 90
