name: boundary-frozen-prediction

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact frozen prediction implementation commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: boundary-frozen-prediction
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: 1755859a9de82c2e5e225be68abc401a5ebf2b4f
          path: upstream/otel-demo
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify frozen design, scoring and pinned workload
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          sha256sum --check SHA256SUMS
          python -B -m unittest discover -s boundary/tests -v
          python -B -m unittest discover -s boundary/history/tests -v
          python -B -m unittest discover -s boundary/prediction/tests -v
          python -B boundary/prediction/scripts/prediction_run.py config > /tmp/prediction-load-design.json
          IMAGE=$(python -c 'import json; print(json.load(open("probe1/runtime.json"))["workload"]["k6_image"])')
          docker run --rm -v "$PWD/boundary/prediction/k6/load.js:/scripts/load.js:ro" -v /tmp/prediction-load-design.json:/scripts/design.json:ro -v "$PWD/upstream/otel-demo/pb:/proto:ro" "$IMAGE" inspect /scripts/load.js
      - id: matrix
        run: echo "matrix=$(python -B boundary/prediction/scripts/prediction_run.py matrix)" >> "$GITHUB_OUTPUT"

  execute:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    name: ${{ matrix.block_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BLOCK_ID: ${{ matrix.block_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: 1755859a9de82c2e5e225be68abc401a5ebf2b4f
          path: upstream/otel-demo
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Five fresh-stack calibrations and frozen forecast
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python -B boundary/prediction/scripts/prediction_run.py calibrate --block-id "$BLOCK_ID" --upstream-dir upstream/otel-demo --output-dir "artifacts/$BLOCK_ID"
      - name: Archive forecast before validation begins
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: boundary-prediction-frozen-${{ matrix.block_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/${{ matrix.block_id }}/frozen-forecast.json
          if-no-files-found: error
          retention-days: 90
      - name: Fresh-stack descending validation on the same runner
        run: |
          set -euo pipefail
          python -B boundary/prediction/scripts/prediction_run.py validate --block-id "$BLOCK_ID" --upstream-dir upstream/otel-demo --output-dir "artifacts/$BLOCK_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: boundary-prediction-block-${{ matrix.block_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

  aggregate:
    if: always() && needs.verify.result == 'success'
    needs: [verify, execute]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: boundary-prediction-block-*-attempt-*
          path: prediction-inputs
      - name: Rescore primary events and compare frozen predictions
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python -B boundary/prediction/scripts/prediction_analyze.py --inputs prediction-inputs --output-dir prediction-results
          cat prediction-results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: boundary-prediction-results-attempt-${{ github.run_attempt }}
          path: prediction-results/
          if-no-files-found: warn
          retention-days: 90
