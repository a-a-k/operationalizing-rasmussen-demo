name: boundary-quota-precision

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact actuator-check implementation commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify exact commit and pull pinned idle-container image
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          sha256sum --check SHA256SUMS
          python -B boundary/prediction/scripts/quota_precision.py describe
          IMAGE=$(python -c 'import json; print(json.load(open("probe1/runtime.json"))["workload"]["k6_image"])')
          docker pull "$IMAGE"
      - name: Record thousandth-CPU behavior with the original driver
        run: python -B boundary/prediction/scripts/quota_precision.py probe --output artifacts/precision/original
      - name: Select cgroupfs on this disposable runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3 boundary/prediction/scripts/quota_precision.py configure --output artifacts/precision/configuration
      - name: Require exact quotas for all 221 thousandth-CPU pairs
        run: python -B boundary/prediction/scripts/quota_precision.py probe --dense --require-match --output artifacts/precision/cgroupfs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: boundary-quota-precision-v0.1.0
          path: artifacts/precision/
          if-no-files-found: warn
          retention-days: 90
