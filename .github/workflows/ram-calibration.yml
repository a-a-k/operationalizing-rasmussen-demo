name: ram-range-calibration

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit containing ram-range-calibration-0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ram-range-calibration
  cancel-in-progress: false

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout experiment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout pinned runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: 1755859a9de82c2e5e225be68abc401a5ebf2b4f
          path: upstream/otel-demo
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify fixed grid, pinned inputs and lightweight tests
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          sha256sum --check SHA256SUMS
          python -m unittest discover -s probe6/tests -v
          python probe6/scripts/ram_calibration.py verify --upstream-dir upstream/otel-demo
      - name: Fixed nine-condition engineering matrix
        id: matrix
        run: |
          matrix="$(python probe6/scripts/ram_calibration.py matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  execute:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    name: ${{ matrix.condition_id }}
    env:
      CONDITION_ID: ${{ matrix.condition_id }}
    steps:
      - name: Checkout experiment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout pinned runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: 1755859a9de82c2e5e225be68abc401a5ebf2b4f
          path: upstream/otel-demo
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Measure baseline and one RAM-only intervention
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python probe6/scripts/ram_calibration.py run --upstream-dir upstream/otel-demo \
            --condition-id "$CONDITION_ID" --artifact-dir "artifacts/$CONDITION_ID"
      - name: Preserve all calibration evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ram-calibration-${{ matrix.condition_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1

  aggregate:
    if: always() && needs.verify.result == 'success'
    needs: [verify, execute]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout experiment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Download every available calibration condition
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ram-calibration-*
          path: calibration-artifacts
      - name: Summarize observed RAM pressure and externally measured SLO
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python probe6/scripts/ram_calibration.py analyze --results-root calibration-artifacts \
            --output-dir calibration-results --repository-commit "$GITHUB_SHA"
          cat calibration-results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve compact engineering results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ram-calibration-results
          path: calibration-results/
          if-no-files-found: warn
          retention-days: 90
