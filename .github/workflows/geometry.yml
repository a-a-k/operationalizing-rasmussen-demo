name: compositional-geometry

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit containing compositional-geometry-0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact analysis commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify checksums and lightweight geometry tests
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          sha256sum --check SHA256SUMS
          python -B -m unittest discover -s geometry/tests -v
      - name: Analyze saved observations without starting a runtime
        run: |
          set -euo pipefail
          python -B geometry/scripts/analyze.py --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --output artifacts/geometry-v0.1.0
      - name: Preserve geometry table, coordinates, figure and verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geometry-v0.1.0
          path: artifacts/geometry-v0.1.0/
          if-no-files-found: error
          retention-days: 90
