services:
  accounting:
    image: ghcr.io/open-telemetry/demo@sha256:74c490f862da264bc7c3b93fefb1a6cfce138861c3c6a8e0ceb32363bef17aaf
    build: !reset null
    deploy:
      resources:
        limits:
          memory: 256M
  kafka:
    image: ghcr.io/open-telemetry/demo@sha256:0601750a3ca4db7d27f746dc73f4180fda162e7a92a1a4847f5b6ae9ac51d477
    build: !reset null
    deploy:
      resources:
        limits:
          memory: 1024M
  fraud-detection:
    image: ghcr.io/open-telemetry/demo@sha256:1cdfd1bcf476914c39afff9d91144fe7a6bffd6b897b4e29b20485791c8ec6a5
    build: !reset null
  frontend:
    deploy:
      resources:
        limits:
          memory: 512M
  cart:
    deploy:
      resources:
        limits:
          memory: 256M
  checkout:
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      GOMEMLIMIT: 128MiB
  payment:
    deploy:
      resources:
        limits:
          memory: 192M
  currency:
    deploy:
      resources:
        limits:
          memory: 128M
  shipping:
    deploy:
      resources:
        limits:
          memory: 128M
  product-catalog:
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      GOMEMLIMIT: 128MiB
  ad:
    deploy:
      resources:
        limits:
          memory: 512M
  astronomy-db:
    command: postgres -c shared_preload_libraries=pg_stat_statements -c track_commit_timestamp=on
    deploy:
      resources:
        limits:
          memory: 1024M
